<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>TIGRESS — First Admin Setup</title>
  <style>
    :root{color-scheme:dark}body{margin:0;background:#0d0d0d;color:#f5f5f5;font-family:Arial,Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,460px);padding:28px;border:1px solid #2c2c2c;border-radius:18px;background:#141414;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:24px}.sub{color:#aaa;line-height:1.7;font-size:14px;margin-bottom:22px}.field{margin:12px 0}.field label{display:block;margin-bottom:7px;color:#ccc}.field input{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff;outline:none}.field input:focus{border-color:#b89a67}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#c4a46d;color:#111;font-weight:700;cursor:pointer}.msg{margin-top:16px;padding:12px;border-radius:10px;background:#0d0d0d;white-space:pre-wrap;line-height:1.6;font-size:13px}.warn{color:#e9c98f}.ok{color:#8ee3aa}.err{color:#ff9b9b}code{direction:ltr;display:inline-block}</style>
</head>
<body>
  <main class="card">
    <h1>إنشاء أول Admin</h1>
    <p class="sub">استخدم الصفحة دي مرة واحدة فقط بينما <b>Sign-up with Email</b> مفعّل في Neon. بعد إنشاء الحساب وإضافته إلى <code>site_admins</code> اقفل الـSign-up.</p>
    <form id="form">
      <div class="field"><label>الاسم</label><input id="name" value="TIGRESS Admin" required></div>
      <div class="field"><label>البريد</label><input id="email" type="email" required></div>
      <div class="field"><label>كلمة السر</label><input id="password" type="password" minlength="8" required></div>
      <button>إنشاء الحساب</button>
    </form>
    <div id="msg" class="msg warn">بعد نجاح الإنشاء: افتح Neon → SQL Editor → database: neondb، ثم نفّذ أمر إضافة البريد إلى site_admins.</div>
  </main>
  <script src="js/neon-config.js"></script>
  <script type="module">
    import { createAuthClient, SupabaseAuthAdapter } from 'https://cdn.jsdelivr.net/npm/@neondatabase/auth@0.7.0-beta/+esm';
    const cfg=window.TIGRESS_NEON||{};
    const msg=document.querySelector('#msg');
    if(!cfg.authUrl){msg.className='msg err';msg.textContent='Auth URL غير موجود في js/neon-config.js';}
    const auth=cfg.authUrl?createAuthClient(cfg.authUrl,{adapter:SupabaseAuthAdapter()}):null;
    document.querySelector('#form').addEventListener('submit',async(e)=>{
      e.preventDefault();
      if(!auth)return;
      msg.className='msg warn';msg.textContent='جاري إنشاء الحساب…';
      const email=document.querySelector('#email').value.trim();
      const password=document.querySelector('#password').value;
      const name=document.querySelector('#name').value.trim();
      try{
        const {data,error}=await auth.signUp({email,password,options:{data:{name}}});
        if(error)throw error;
        msg.className='msg ok';
        msg.textContent=`تم إنشاء الحساب ✅\n\nEmail: ${email}\n\nالآن أضف هذا البريد إلى site_admins من SQL Editor، وبعدها اقفل Sign-up with Email وافتح /admin.`;
      }catch(err){msg.className='msg err';msg.textContent='فشل الإنشاء: '+(err?.message||String(err));}
    });
  </script>
</body>
</html>
